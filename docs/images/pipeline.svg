<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
  <title id="t">Pipeline</title>
  <desc id="d">Raw CSV files, then 1 Clean, 2 Rebuild demand, 3 Features, 4 Backtest, 5 LightGBM model; the model writes the forecast files and the dashboard data, which the dashboard reads.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8c959f"/>
    </marker>
    <style>
      .t{font:600 14px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
      .c{font:12px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#59636e}
      .m{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#59636e}
      .n{font:700 12px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#fff}
      .box{fill:#fff;stroke:#d0d7de;stroke-width:1.2}
      .ln{fill:none;stroke:#8c959f;stroke-width:1.5}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="299" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>

  <!-- row 1: prepare the data -->
  <rect x="24" y="34" width="190" height="64" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text class="t" x="44" y="61">Raw CSV files</text>
  <text class="c" x="44" y="80">train, test + 5 more</text>

  <rect class="box" x="246" y="34" width="190" height="64" rx="10"/>
  <circle cx="268" cy="66" r="11" fill="#2f6fdb"/><text class="n" x="268" y="70.5" text-anchor="middle">1</text>
  <text class="t" x="288" y="61">Clean</text>
  <text class="c" x="288" y="80">dates, names, units</text>

  <rect class="box" x="468" y="34" width="190" height="64" rx="10"/>
  <circle cx="490" cy="66" r="11" fill="#2f6fdb"/><text class="n" x="490" y="70.5" text-anchor="middle">2</text>
  <text class="t" x="510" y="61">Rebuild demand</text>
  <text class="c" x="510" y="80">stockouts, anomalies</text>

  <rect class="box" x="690" y="34" width="190" height="64" rx="10"/>
  <circle cx="712" cy="66" r="11" fill="#2f6fdb"/><text class="n" x="712" y="70.5" text-anchor="middle">3</text>
  <text class="t" x="732" y="61">Features</text>
  <text class="c" x="732" y="80">calendar, economy</text>

  <path class="ln" d="M216 66H242" marker-end="url(#a)"/>
  <path class="ln" d="M438 66H464" marker-end="url(#a)"/>
  <path class="ln" d="M660 66H686" marker-end="url(#a)"/>

  <!-- wrap to row 2 -->
  <path class="ln" d="M785 100V128H119V160" marker-end="url(#a)"/>

  <!-- row 2: forecast and publish -->
  <rect class="box" x="24" y="164" width="190" height="64" rx="10"/>
  <circle cx="46" cy="196" r="11" fill="#e8590c"/><text class="n" x="46" y="200.5" text-anchor="middle">4</text>
  <text class="t" x="66" y="191">Backtest</text>
  <text class="c" x="66" y="210">6 baselines, 4 dates</text>

  <rect x="246" y="164" width="190" height="64" rx="10" fill="#fff" stroke="#e8590c" stroke-width="1.6"/>
  <circle cx="268" cy="196" r="11" fill="#e8590c"/><text class="n" x="268" y="200.5" text-anchor="middle">5</text>
  <text class="t" x="288" y="191">LightGBM model</text>
  <text class="c" x="288" y="210">P10 / P50 / P90</text>

  <path class="ln" d="M216 196H242" marker-end="url(#a)"/>

  <rect class="box" x="468" y="148" width="190" height="56" rx="10"/>
  <text class="t" x="488" y="172">Forecast files</text>
  <text class="m" x="488" y="191">submission.csv</text>

  <rect class="box" x="468" y="220" width="190" height="56" rx="10"/>
  <text class="t" x="488" y="244">Dashboard data</text>
  <text class="m" x="488" y="263">dashboard/data</text>

  <path class="ln" d="M438 196H451V176H464" marker-end="url(#a)"/>
  <path class="ln" d="M451 196V248H464" marker-end="url(#a)"/>

  <rect x="690" y="220" width="190" height="56" rx="10" fill="#1f2328"/>
  <text class="t" x="710" y="244" style="fill:#fff">Dashboard</text>
  <text class="c" x="710" y="263" style="fill:#c9d1d9">live site or local</text>

  <path class="ln" d="M660 248H686" marker-end="url(#a)"/>
</svg>
